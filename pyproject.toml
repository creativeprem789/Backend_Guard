[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-guard"
version = "1.0.0"
description = "Universal Backend Codebase Auditor (Backend Guard) - Static architecture, security, and quality analysis."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Backend Guard Core Maintainers", email = "maintainers@backendguard.org" }
]
keywords = [
    "backend",
    "static-analysis",
    "architecture",
    "linter",
    "security",
    "fastapi",
    "express",
    "nestjs",
    "django"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/creativeprem789/Backend_Guard"
Repository = "https://github.com/creativeprem789/Backend_Guard.git"
Documentation = "https://github.com/creativeprem789/Backend_Guard#readme"
"Bug Tracker" = "https://github.com/creativeprem789/Backend_Guard/issues"

[project.scripts]
backend-guard = "auditor.cli:main"
backend-auditor = "auditor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auditor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

